<div style="font-family: 'Segoe UI', system-ui, Arial, sans-serif; font-size: 14px; max-width: 560px; margin: 0 auto; background-color: #fdf6ee; padding: 28px 22px; border-radius: 16px; color: #3a2a1d;">

  <!-- Header -->
  <div style="text-align: center; padding-bottom: 18px; border-bottom: 1px solid #f0e0cd;">
    <div style="font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #c89b5c; font-weight: 600;">Shringara Mehandi</div>
    <div style="font-size: 22px; font-weight: 700; color: #4e2d16; margin-top: 6px;">New Booking Request 🌿</div>
  </div>

  <div style="margin-top: 22px; font-size: 15px; color: #6b5644;">
    A new booking request from <strong>{{from_name}}</strong> has been received. Kindly respond at your earliest convenience.
  </div>

  <!-- Contact card -->
  <div style="margin-top: 20px; padding: 16px 0; border-width: 1px 0; border-style: dashed; border-color: #e3cfb6;">
    <table role="presentation" style="width: 100%;">
      <tr>
        <td style="vertical-align: top; width: 52px;">
          <div style="padding: 8px 12px; margin: 0 10px 0 0; background-color: #f6e9da; border-radius: 10px; font-size: 26px; text-align: center;" role="img">👰</div>
        </td>
        <td style="vertical-align: top;">
          <div style="color: #4e2d16; font-size: 17px;"><strong>{{from_name}}</strong></div>
          <div style="color: #b39b85; font-size: 13px;">{{time}}</div>
          <p style="font-size: 15px; color: #3a2a1d; margin: 10px 0 0;">{{message}}</p>
        </td>
      </tr>
    </table>
  </div>

  <!-- Details -->
  <table role="presentation" style="width: 100%; margin-top: 18px; border-collapse: collapse; font-size: 14px;">
    <tr>
      <td style="padding: 10px 12px; background-color: #ffffff; border-radius: 8px 0 0 8px; color: #8a7461; width: 110px;">📞 Phone</td>
      <td style="padding: 10px 12px; background-color: #ffffff; border-radius: 0 8px 8px 0; color: #3a2a1d; font-weight: 600;">{{phone}}</td>
    </tr>
    <tr><td colspan="2" style="height: 6px;"></td></tr>
    <tr>
      <td style="padding: 10px 12px; background-color: #ffffff; border-radius: 8px 0 0 8px; color: #8a7461;">✉️ Email</td>
      <td style="padding: 10px 12px; background-color: #ffffff; border-radius: 0 8px 8px 0; color: #3a2a1d; font-weight: 600;">{{email}}</td>
    </tr>
    <tr><td colspan="2" style="height: 6px;"></td></tr>
    <tr>
      <td style="padding: 10px 12px; background-color: #ffffff; border-radius: 8px 0 0 8px; color: #8a7461;">🎉 Occasion</td>
      <td style="padding: 10px 12px; background-color: #ffffff; border-radius: 0 8px 8px 0; color: #3a2a1d; font-weight: 600;">{{occasion}}</td>
    </tr>
  </table>

  <!-- Footer -->
  <div style="margin-top: 24px; text-align: center; font-size: 12px; color: #b39b85;">
    Sent from <a href="{{page_url}}" style="color: #7b4b2a; text-decoration: none;">your website</a> · Shringara Mehandi ✦
  </div>

</div>
