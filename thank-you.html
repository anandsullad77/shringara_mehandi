<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Shringara Mehandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --henna: #7b4b2a;
      --henna-dark: #4e2d16;
      --henna-light: #c98a5e;
      --cream: #fdf6ee;
      --cream-2: #f6e9da;
      --gold: #c89b5c;
      --ink: #3a2a1d;
      --muted: #8a7461;
      --shadow: 0 18px 40px -22px rgba(78, 45, 22, 0.45);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif; color: var(--ink); line-height: 1.65;
      min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      background:
        radial-gradient(circle at 20% 20%, rgba(200,155,92,0.18), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(123,75,42,0.16), transparent 45%),
        linear-gradient(180deg, var(--cream), var(--cream-2));
    }
    .card {
      background: #fff; border-radius: 24px; padding: 3rem 2.5rem; max-width: 520px;
      text-align: center; box-shadow: var(--shadow); border: 1px solid var(--cream-2);
    }
    .mark {
      width: 90px; height: 90px; margin: 0 auto 1.5rem; border-radius: 50%;
      background: radial-gradient(circle, var(--henna-light), var(--henna));
      display: grid; place-items: center; color: #fff; font-size: 2.6rem;
      box-shadow: 0 0 0 12px rgba(200,155,92,0.18);
    }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; color: var(--henna-dark); margin-bottom: 0.8rem; }
    p { color: var(--muted); margin-bottom: 1.8rem; }
    .btn {
      display: inline-block; padding: 0.85rem 1.8rem; border-radius: 999px;
      background: linear-gradient(135deg, var(--henna), var(--henna-dark));
      color: #fff; text-decoration: none; font-weight: 500; box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-3px); }
    .ig { display: block; margin-top: 1.2rem; color: var(--henna); text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">✦</div>
    <h1>Thank You!</h1>
    <p>Your booking request has been received. We'll get in touch with you very soon to confirm your appointment and discuss your design. 🌿</p>
    <a href="index.html" class="btn">Back to Home</a>
    <a href="https://www.instagram.com/shringar_mehendi/" target="_blank" rel="noopener" class="ig">📷 Follow us @shringar_mehendi</a>
  </div>
</body>
</html>
